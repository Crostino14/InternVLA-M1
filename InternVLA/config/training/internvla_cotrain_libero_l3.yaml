run_id: internVLA_L3_finetune
run_root_dir: /mnt/beegfs/a.cardamone7/checkpoints/InternVLA_L3_finetune
seed: 42
trackers: [jsonl, wandb]
wandb_entity: agostino-cardamone2001
wandb_project: internVLA
is_debug: false


framework:
  framework_py: InternVLA-M1
  qwenvl:
    base_vlm: /mnt/beegfs/a.cardamone7/checkpoints/Qwen2.5-VL-3B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  dino:
    dino_backbone: dinov2_vitl14
  layer_qformer: 
    qformer_end_layer: 37
    qformer_start_layer: 36
    num_query_tokens: 64
    input_dim: 2048 
    output_dim: 768
    grad_scale: 0.5
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 768
    action_dim: 7
    future_action_window_size: 7
    past_action_window_size: 0
  
  reduce_in_full_precision: true


datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: asv2_conversation_en,asv2_detailed_description_en,asv2_region_captioning_en,coco_internvl_longcap_en,coco_karpathy_train_567_en,coco_negative_gpt4o_en,coco_poetry_zh,coco_rem_en_zh,cocorem_exist_yorn_en,cocotextv2_en,cocotextv2_gpt4o_en,okvqa_en,refcoco_grounding_aug_en,refcoco_grounding_en,tallyqa_coco_en,toloka_grounding_aug_en,vqav2_en,vsr_en
    eval_dataset: aokvqa_cauldron_llava_format
    data_flatten: false
    base_interval: 2
    max_pixels: 50176          
    min_pixels: 784            
    model_max_length: 1024      
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /mnt/beegfs/a.cardamone7/datasets/lerobot_libero_goal_l3
    data_mix: libero_goal_l3_finetune
    action_type: delta_qpos
    CoT_prompt: "Your task is {instruction}. First, identify key objects and their positions using spatial relations: left/right of, in front/behind, next to, above/below. Then execute the action." 
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 8
    max_episodes_per_task: 10
    load_all_data_for_training: true


trainer:
  repeated_diffusion_steps: 10
  max_train_steps: 50000
  num_warmup_steps: 1500       
  save_interval: 500
  eval_interval: 500           
  learning_rate:
    base: 5e-05
    qformer: 5e-05
    action_model: 1e-05 
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: 'qwen_vl_interface,dino_encoder,dino_pro'
  loss_scale:
    vla: 1.0
  weight_decay: 0.01
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.01

  # parameters to be determined
  pretrained_checkpoint: /mnt/beegfs/a.cardamone7/checkpoints/InternVLA-M1-LIBERO-Goal/checkpoints/steps_30000_pytorch_model.pt
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
